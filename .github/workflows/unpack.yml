name: Unpack update zip

# ارفع ملف .zip في جذر الريبو (مثلًا update.zip) وهو هيتفك ويستبدل ملفات المشروع لوحده،
# وبعدها الزيب بيتمسح. بعد كده شغّل "Build Android APK" زي العادة.
on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

concurrency:
  group: unpack-zip
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find zip
        id: find
        run: |
          ZIP="$(ls -1t ./*.zip 2>/dev/null | head -n1 || true)"
          if [ -z "$ZIP" ]; then
            echo "مفيش ملف zip في الجذر — مفيش حاجة تتعمل."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "zip=${ZIP#./}" >> "$GITHUB_OUTPUT"
          fi

      - name: Unpack over the project
        if: steps.find.outputs.found == 'true'
        run: bash scripts/unpack.sh "${{ steps.find.outputs.zip }}" .

      - name: Remove the zip and commit
        if: steps.find.outputs.found == 'true'
        run: |
          rm -f -- ./*.zip
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "مفيش تغييرات."
          else
            git commit -m "Apply update from ${{ steps.find.outputs.zip }}"
            git push
          fi
