name: Unpack update zip

# ارفع ملف .zip في جذر الريبو (أي اسم) وهو هيتفك ويستبدل ملفات المشروع لوحده، وبعدها الزيب بيتمسح.
# تقدر كمان تشغّله يدويًا من تبويب Actions لو الزيب موجود أصلًا في الجذر.
# الـ workflow مستقل بنفسه: مش محتاج أي ملف تاني في الريبو.
on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-zip
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack zip over the project
        id: unpack
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(./*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "مفيش ملف zip في جذر الريبو — مفيش حاجة تتعمل."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # آخر زيب اتعدّل
          ZIP="$(ls -1t -- "${zips[@]}" | head -n1)"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "📦 $ZIP"

          TARGET="$(pwd)"
          TMP="$(mktemp -d)"
          unzip -q -o "$ZIP" -d "$TMP"
          rm -rf "$TMP/__MACOSX"

          # لو الزيب جواه فولدر واحد بس (زي زيب GitHub) ندخل جواه
          shopt -s dotglob
          entries=("$TMP"/*)
          shopt -u dotglob
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then SRC="${entries[0]}"; else SRC="$TMP"; fi

          # حماية: لازم يبقى مشروع أندرويد وإلا نوقف من غير ما نغيّر حاجة
          if [ ! -f "$SRC/settings.gradle.kts" ] && [ ! -f "$SRC/settings.gradle" ]; then
            echo "❌ الزيب مش شكله مشروع أندرويد (مفيش settings.gradle). مفيش حاجة اتغيّرت."; exit 1
          fi
          if [ ! -d "$SRC/app/src" ]; then
            echo "❌ مفيش app/src جوه الزيب. مفيش حاجة اتغيّرت."; exit 1
          fi

          is_protected() {
            case "$1" in
              .git|.git/*|.github|.github/*|local.properties) return 0 ;;
              *.zip|*.jks|*.keystore) return 0 ;;
            esac
            return 1
          }

          # 1) امسح من المشروع أي ملف مش موجود في الزيب
          while IFS= read -r -d '' f; do
            rel="${f#"$TARGET"/}"
            is_protected "$rel" && continue
            [ -e "$SRC/$rel" ] || { rm -f -- "$f"; echo "🗑  $rel"; }
          done < <(find "$TARGET" -type f -not -path "$TARGET/.git/*" -print0)

          # 2) انسخ ملفات الزيب فوق المشروع
          while IFS= read -r -d '' f; do
            rel="${f#"$SRC"/}"
            is_protected "$rel" && continue
            mkdir -p -- "$TARGET/$(dirname "$rel")"
            cp -f -- "$f" "$TARGET/$rel"
          done < <(find "$SRC" -type f -print0)

          # 3) نضّف الفولدرات الفاضية
          find "$TARGET" -mindepth 1 -type d -empty -not -path "$TARGET/.git/*" -not -path "$TARGET/.git" -delete 2>/dev/null || true

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "✅ تم استبدال الملفات."

      - name: Remove the zip and commit
        if: steps.unpack.outputs.found == 'true'
        shell: bash
        env:
          ZIP_NAME: ${{ steps.unpack.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f -- ./*.zip
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "مفيش تغييرات."
          else
            git commit -m "Apply update from ${ZIP_NAME#./}"
            git push
          fi